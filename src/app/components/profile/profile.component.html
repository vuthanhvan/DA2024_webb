<div class="">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body p-4" style="  margin: 50px 250px;">
                    <div class="text-center">
                        <!-- <div class="avatar-md mx-auto mb-4">
                            <div class="avatar-title bg-light rounded-circle text-primary h1">
                                <i class="mdi mdi-email-open"></i>
                            </div>
                        </div> -->
                        <div class="row justify-content-center">

                            <div *ngIf="errorMessage" class="error-message" style="padding: 20px">
                                {{ errorMessage }}
                            </div>

                            <div class="col-xl-10" *ngIf="!errorMessage && profile && !loading"
                                class="profile-container">
                                <h4 class="text-primary"> &#64; {{ profile.name }}</h4>
                                <p class="text-muted font-size-14 mb-4">{{ profile.description }} </p>

                                <div class="card" style="    border: none !important; ">
                                   
                                    <div class="table-responsive">
                                        <table class="table align-middle table-nowrap">
                                            <tbody>
                                                <tr>
                                                    <td>
                                                        <h5 class="font-size-14 m-0 text-dark">
                                                            UserName :
                                                        </h5>
                                                    </td>
                                                    <td>
                                                        <div class="badge text-primary font-size-14">
                                                            {{ profile.name }}
                                                        </div>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <h5 class="font-size-14 m-0 text-dark">Description: :</h5>
                                                    </td>
                                                    <td>
                                                        <div class="badge text-primary font-size-14">
                                                            {{ profile.description }}
                                                        </div>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <h5 class="font-size-14 m-0 text-dark">Address :</h5>
                                                    </td>
                                                    <td>
                                                        <div class="badge text-primary font-size-14">
                                                            {{ profile.address }}
                                                        </div>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td>
                                                        <h5 class="font-size-14 m-0 text-dark">Facebook :</h5>
                                                    </td>
                                                    <td>
                                                        <div>
                                                            <a href="javascript: void(0);"
                                                                class="badge bg-primary-subtle text-primary font-size-11">
                                                                {{ profile.facebook }}</a>
                                                        </div>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <h5 class="font-size-14 m-0 text-dark">Linkedin :</h5>
                                                    </td>
                                                    <td>
                                                        <div>
                                                            <a href="javascript: void(0);"
                                                                class="badge bg-primary-subtle text-primary font-size-11">{{
                                                                profile.linkein }} </a>
                                                        </div>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <h5 class="font-size-14 m-0 text-dark">Github :</h5>
                                                    </td>
                                                    <td>
                                                        <div>
                                                            <a href="javascript: void(0);"
                                                                class="badge bg-primary-subtle text-primary font-size-11">{{profile.github
                                                                }} </a>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <button expand="block" [routerLink]="['/edit-profile']">
                                    Edit Profile
                                  </button>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
